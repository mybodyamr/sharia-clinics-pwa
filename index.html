<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="نظام تجريبي لإدارة عيادات الجمعية الشرعية">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230f766e'/%3E%3Cpath fill='white' d='M46 20h8v26h26v8H54v26h-8V54H20v-8h26z'/%3E%3C/svg%3E">
  <title>عيادات الجمعية الشرعية</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Cairo','ui-sans-serif','system-ui'] },
          boxShadow: {
            soft: '0 12px 40px rgba(15, 23, 42, .08)'
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    html,body{font-family:Cairo,system-ui,sans-serif;background:#f8fafc}
    body{min-height:100vh}
    *{scrollbar-width:thin;scrollbar-color:#cbd5e1 transparent}
    .glass{background:rgba(255,255,255,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
    .fade-in{animation:fade .22s ease-out}
    @keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
    .toast-in{animation:toast .25s ease-out}
    @keyframes toast{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
    .modal-bg{background:rgba(15,23,42,.55);backdrop-filter:blur(4px)}
    .focus-ring:focus{outline:2px solid #14b8a6;outline-offset:2px}
    input,select,textarea{outline:none}
    .ticket-paper{width:min(100%,560px);background:#fff;border:1px solid #e2e8f0;border-radius:28px;overflow:hidden;box-shadow:0 20px 60px rgba(15,23,42,.12)}
    .ticket-top{background:linear-gradient(135deg,#0f766e,#115e59);color:#fff;padding:22px}
    .ticket-queue{background:#0b1224;color:#fff;border-radius:24px;padding:20px;text-align:center}
    .ticket-qr{background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:18px;display:grid;place-items:center}
    .scan-frame{border:2px dashed #0f766e;background:linear-gradient(180deg,#f0fdfa,#fff);border-radius:24px;min-height:230px}
    .scan-line{height:2px;background:#14b8a6;box-shadow:0 0 16px rgba(20,184,166,.7);animation:scanline 2s ease-in-out infinite}
    @keyframes scanline{0%,100%{transform:translateY(-85px)}50%{transform:translateY(85px)}}
    .ticket-capture{position:fixed;left:-100000px;top:0;width:700px;background:#f8fafc;padding:24px;z-index:-1}
    .ltr{direction:ltr;text-align:left}
    @media print{body>*{display:none!important}#print-ticket{display:block!important}@page{size:80mm auto;margin:4mm}}
  </style>
</head>
<body class="text-slate-800">
<div id="app"></div>
<div id="toast-root" class="fixed top-4 left-4 z-[100] space-y-2 w-[min(92vw,380px)]"></div>
<div id="modal-root"></div>
<div id="print-ticket" class="hidden"></div>

<script>
(() => {
'use strict';

const APP = {key:'sharia_clinics_demo_v2',sessionKey:'sharia_clinics_session_v2',version:2};
const today=()=>new Date().toISOString().slice(0,10);
const nowTime=()=>new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
const esc=(v='')=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const uid=()=> (crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0,v=c==='x'?r:(r&3)|8;return v.toString(16)}));
const hash=async text=>{const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('')};
const shortHash=async text=>(await hash(text)).slice(0,24);
const save=()=>localStorage.setItem(APP.key,JSON.stringify(db));
const load=()=>{try{return JSON.parse(localStorage.getItem(APP.key))||seed()}catch{return seed()}};
function seed(){return {settings:{maxDefault:50,clinicName:'عيادات الجمعية الشرعية'},users:[{id:uid(),name:'مدير النظام',username:'admin',password:'admin123',role:'admin',active:true},{id:uid(),name:'د. أحمد محمد',username:'doc1',password:'123456',role:'doctor',clinicId:'c1',present:true,reason:''},{id:uid(),name:'د. محمود علي',username:'doc2',password:'123456',role:'doctor',clinicId:'c2',present:false,reason:'إجازة اليوم'},{id:uid(),name:'موظف استقبال 1',username:'reception',password:'123456',role:'reception',active:true}],clinics:[{id:'c1',name:'عيادة الباطنة',specialty:'باطنة عامة',max:50,doctorId:null},{id:'c2',name:'عيادة الأطفال',specialty:'أطفال',max:35,doctorId:null},{id:'c3',name:'عيادة الأسنان',specialty:'أسنان',max:40,doctorId:null}],bookings:[],scans:[],absences:[]}};
let db=load();if(!db.settings)db=seed();db.users.forEach(u=>{if(u.role==='doctor'){const c=db.clinics.find(x=>x.id===u.clinicId);if(c)c.doctorId=u.id}});save();
let session=null;try{session=JSON.parse(sessionStorage.getItem(APP.sessionKey)||'null')}catch{}
let view=session?({admin:'admin',doctor:'doctor',reception:'reception'}[session.role]||'login'):'login';
let lastTicket=null,scannerCode='';
const roleLabel=r=>({admin:'مدير النظام',doctor:'طبيب',reception:'استقبال',patient:'مريض'}[r]||r);
const getUser=id=>db.users.find(u=>u.id===id);const getClinic=id=>db.clinics.find(c=>c.id===id);
const todayBookings=(clinicId=null)=>db.bookings.filter(b=>b.date===today()&&(!clinicId||b.clinicId===clinicId));
const doctorFor=clinic=>getUser(clinic.doctorId);const clinicOpen=clinic=>{const d=doctorFor(clinic);return!!(d&&d.present)};
const bookingCount=clinicId=>todayBookings(clinicId).length;
const statusPill=(text,cls='bg-slate-100 text-slate-700')=>`<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-bold ${cls}">${esc(text)}</span>`;
function toast(message,type='info'){const colors={info:'border-sky-200 bg-white',success:'border-emerald-200 bg-emerald-50',error:'border-rose-200 bg-rose-50',warn:'border-amber-200 bg-amber-50'},icon={info:'ℹ️',success:'✅',error:'⛔',warn:'⚠️'}[type];const el=document.createElement('div');el.className=`toast-in rounded-2xl border ${colors[type]} shadow-soft p-3.5 flex gap-3 items-start`;el.innerHTML=`<div>${icon}</div><div class="text-sm font-semibold leading-6">${esc(message)}</div>`;document.getElementById('toast-root').appendChild(el);setTimeout(()=>el.remove(),4200)}
function setSession(u){session={id:u.id,name:u.name,username:u.username,role:u.role,clinicId:u.clinicId||null};sessionStorage.setItem(APP.sessionKey,JSON.stringify(session))}
function logout(){session=null;sessionStorage.removeItem(APP.sessionKey);view='login';render()}
function nav(v){view=v;render();window.scrollTo({top:0,behavior:'smooth'})}
function shell(active,title,subtitle,content){const navItems=session?.role==='admin'?[['admin','لوحة التحكم','▦'],['users','المستخدمون','♙'],['clinics','العيادات','⚕']]:session?.role==='doctor'?[['doctor','لوحتي','⌂']]:[['reception','الاستقبال والطابور','▣']];return `<div class="min-h-screen"><header class="sticky top-0 z-40 border-b border-slate-200/80 glass"><div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-2xl bg-teal-700 text-white grid place-items-center text-xl font-black">+</div><div><div class="font-extrabold text-sm sm:text-base">عيادات الجمعية الشرعية</div><div class="text-[11px] text-slate-500">نظام الإدارة والحجز — وضع تجريبي</div></div></div><div class="flex items-center gap-2">${session?`<div class="hidden sm:block text-left"><div class="text-xs font-bold">${esc(session.name)}</div><div class="text-[11px] text-slate-500">${roleLabel(session.role)}</div></div>`:''}<button onclick="logout()" class="focus-ring rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm font-bold hover:bg-slate-50">خروج</button></div></div></header><div class="max-w-7xl mx-auto px-4 sm:px-6 py-5"><div class="flex flex-col lg:flex-row gap-5"><aside class="lg:w-56 shrink-0"><div class="bg-white border border-slate-200 rounded-3xl p-2 shadow-soft lg:sticky lg:top-24">${navItems.map(([id,label,ic])=>`<button onclick="nav('${id}')" class="w-full flex items-center gap-3 px-3 py-3 rounded-2xl text-sm font-bold mb-1 ${active===id?'bg-teal-50 text-teal-800':'text-slate-600 hover:bg-slate-50'}"><span class="w-8 h-8 rounded-xl grid place-items-center ${active===id?'bg-teal-100':'bg-slate-100'}">${ic}</span>${label}</button>`).join('')}<button onclick="nav('patient')" class="w-full flex items-center gap-3 px-3 py-3 rounded-2xl text-sm font-bold text-slate-600 hover:bg-slate-50"><span class="w-8 h-8 rounded-xl bg-slate-100 grid place-items-center">👤</span>حجز مريض</button></div></aside><main class="flex-1 min-w-0"><div class="mb-5"><h1 class="text-2xl sm:text-3xl font-black">${title}</h1><p class="text-sm text-slate-500 mt-1">${subtitle}</p></div><div class="fade-in">${content}</div></main></div></div></div>`}
function loginView(){return `<div class="min-h-screen grid lg:grid-cols-2"><section class="hidden lg:flex bg-gradient-to-br from-teal-800 to-slate-900 text-white p-12 items-center"><div class="max-w-lg mx-auto"><div class="w-16 h-16 rounded-3xl bg-white/10 grid place-items-center text-4xl font-black mb-6">+</div><div class="text-4xl font-black leading-tight">عيادات الجمعية الشرعية</div><p class="mt-5 text-teal-50/80 leading-8">منصة موحدة للحجز وإدارة العيادات والطوابير والاستقبال.</p><div class="mt-8 grid grid-cols-3 gap-3">${[['⚕','العيادات'],['🎫','الحجز'],['▣','QR']].map(x=>`<div class="rounded-2xl bg-white/10 p-4"><div class="text-2xl">${x[0]}</div><div class="text-sm mt-2 font-bold">${x[1]}</div></div>`).join('')}</div></div></section><section class="p-5 sm:p-10 flex items-center"><div class="w-full max-w-md mx-auto"><div class="lg:hidden text-center mb-8"><div class="mx-auto w-14 h-14 rounded-2xl bg-teal-700 text-white grid place-items-center text-3xl font-black">+</div><h1 class="text-2xl font-black mt-3">عيادات الجمعية الشرعية</h1></div><div class="bg-white border border-slate-200 rounded-[30px] shadow-soft p-6 sm:p-8"><h2 class="text-2xl font-black">تسجيل الدخول</h2><p class="text-sm text-slate-500 mt-1">للمدير والطبيب وموظف الاستقبال</p><form onsubmit="doLogin(event)" class="mt-6 space-y-4"><label class="block"><span class="text-sm font-bold">اسم المستخدم</span><input id="login-user" required class="focus-ring mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3" placeholder="مثال: admin"></label><label class="block"><span class="text-sm font-bold">كلمة المرور</span><input id="login-pass" type="password" required class="focus-ring mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3" placeholder="••••••••"></label><button class="w-full rounded-2xl bg-teal-700 hover:bg-teal-800 text-white py-3.5 font-extrabold">دخول</button></form><div class="mt-6 p-4 rounded-2xl bg-slate-50 text-xs leading-6"><b>حسابات التجربة:</b><br>admin / admin123<br>doc1 / 123456<br>reception / 123456</div><button onclick="nav('patient')" class="mt-4 w-full rounded-2xl border border-teal-200 text-teal-800 py-3 font-bold hover:bg-teal-50">حجز مريض بدون حساب</button></div></div></section></div>`}
function doLogin(e){e.preventDefault();const u=document.getElementById('login-user').value.trim(),p=document.getElementById('login-pass').value;const found=db.users.find(x=>x.username===u&&x.password===p&&x.active!==false);if(!found){toast('اسم المستخدم أو كلمة المرور غير صحيحة','error');return}setSession(found);view={admin:'admin',doctor:'doctor',reception:'reception'}[found.role]||'login';render();toast('تم تسجيل الدخول بنجاح','success')}
function statCard(label,value,icon){return `<div class="bg-white border border-slate-200 rounded-3xl p-5 shadow-soft"><div class="flex items-center justify-between"><div><div class="text-sm text-slate-500 font-semibold">${label}</div><div class="text-3xl font-black mt-2">${value}</div></div><div class="w-12 h-12 rounded-2xl bg-teal-50 text-teal-700 grid place-items-center text-2xl">${icon}</div></div></div>`}
function adminView(){const users=db.users.length,docs=db.users.filter(u=>u.role==='doctor').length,open=db.clinics.filter(clinicOpen).length,books=todayBookings().length;return shell('admin','لوحة التحكم','نظرة سريعة على تشغيل العيادات اليوم',`<div class="grid sm:grid-cols-2 xl:grid-cols-4 gap-4">${statCard('المستخدمون',users,'♙')}${statCard('الأطباء',docs,'⚕')}${statCard('العيادات المفتوحة',open,'✓')}${statCard('حجوزات اليوم',books,'🎫')}</div><div class="grid xl:grid-cols-2 gap-5 mt-5"><div class="bg-white border border-slate-200 rounded-3xl p-5 shadow-soft"><div class="flex items-center justify-between"><h3 class="font-black text-lg">حالة العيادات</h3><button onclick="nav('clinics')" class="text-sm font-bold text-teal-700">إدارة العيادات</button></div><div class="mt-4 space-y-3">${db.clinics.map(c=>{const d=doctorFor(c);return `<div class="rounded-2xl bg-slate-50 p-4 flex items-center justify-between gap-3"><div><div class="font-bold">${esc(c.name)}</div><div class="text-xs text-slate-500 mt-1">${esc(c.specialty)} • ${d?esc(d.name):'بدون طبيب'}</div></div>${clinicOpen(c)?statusPill('مفتوحة','bg-emerald-100 text-emerald-800'):statusPill('مغلقة','bg-rose-100 text-rose-800')}</div>`}).join('')}</div></div><div class="bg-white border border-slate-200 rounded-3xl p-5 shadow-soft"><h3 class="font-black text-lg">آخر الحجوزات</h3><div class="mt-4 space-y-3">${todayBookings().slice(-6).reverse().map(b=>`<div class="flex items-center justify-between rounded-2xl bg-slate-50 p-4"><div><div class="font-bold">${esc(b.name)}</div><div class="text-xs text-slate-500 mt-1">${esc(getClinic(b.clinicId)?.name||'')}</div></div><div class="text-center"><div class="text-xl font-black">${b.queue}</div>${statusPill(b.status==='served'?'تم الكشف':b.status==='no-show'?'لم يحضر':'منتظر')}</div></div>`).join('')||'<div class="text-sm text-slate-500 p-4">لا توجد حجوزات اليوم.</div>'}</div></div></div>`)}
function usersView(){return shell('users','إدارة المستخدمين','إضافة وتفعيل الحسابات وتحديد الدور والعيادة',`<div class="flex justify-end mb-4"><button onclick="openUserModal()" class="rounded-2xl bg-teal-700 text-white px-4 py-3 font-extrabold">＋ إضافة مستخدم</button></div><div class="bg-white border border-slate-200 rounded-3xl shadow-soft overflow-hidden"><div class="overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-50"><tr><th class="p-4 text-right">الاسم</th><th class="p-4 text-right">اسم المستخدم</th><th class="p-4 text-right">الدور</th><th class="p-4 text-right">العيادة</th><th class="p-4 text-right">الحالة</th></tr></thead><tbody>${db.users.map(u=>`<tr class="border-t border-slate-100"><td class="p-4 font-bold">${esc(u.name)}</td><td class="p-4 ltr">${esc(u.username)}</td><td class="p-4">${roleLabel(u.role)}</td><td class="p-4">${esc(getClinic(u.clinicId)?.name||'—')}</td><td class="p-4">${u.active===false?statusPill('غير فعال','bg-slate-200 text-slate-600'):statusPill('فعال','bg-emerald-100 text-emerald-800')}</td></tr>`).join('')}</tbody></table></div></div>`)}
function openUserModal(){document.getElementById('modal-root').innerHTML=`<div class="fixed inset-0 z-50 modal-bg grid place-items-center p-4"><div class="bg-white rounded-3xl w-full max-w-lg p-6 shadow-2xl"><div class="flex items-center justify-between"><h3 class="text-xl font-black">إضافة مستخدم</h3><button onclick="closeModal()" class="text-2xl">×</button></div><form onsubmit="saveUser(event)" class="mt-5 space-y-4"><input id="u-name" required class="w-full rounded-2xl border border-slate-200 px-4 py-3" placeholder="الاسم"><input id="u-username" required class="w-full rounded-2xl border border-slate-200 px-4 py-3" placeholder="اسم المستخدم / الكود الوظيفي"><input id="u-password" required type="password" class="w-full rounded-2xl border border-slate-200 px-4 py-3" placeholder="كلمة المرور"><select id="u-role" onchange="toggleClinicField()" class="w-full rounded-2xl border border-slate-200 px-4 py-3"><option value="reception">استقبال</option><option value="doctor">طبيب</option><option value="admin">مدير النظام</option></select><select id="u-clinic" class="w-full rounded-2xl border border-slate-200 px-4 py-3 hidden"><option value="">اختر العيادة</option>${db.clinics.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><button class="w-full rounded-2xl bg-teal-700 text-white py-3 font-extrabold">حفظ</button></form></div></div>`}
function toggleClinicField(){const r=document.getElementById('u-role')?.value;document.getElementById('u-clinic')?.classList.toggle('hidden',r!=='doctor')}
function saveUser(e){e.preventDefault();const name=document.getElementById('u-name').value.trim(),username=document.getElementById('u-username').value.trim(),password=document.getElementById('u-password').value,role=document.getElementById('u-role').value,clinicId=document.getElementById('u-clinic').value;if(db.users.some(u=>u.username===username)){toast('اسم المستخدم مستخدم بالفعل','error');return}if(role==='doctor'&&!clinicId){toast('اختر عيادة للطبيب','warn');return}db.users.push({id:uid(),name,username,password,role,clinicId:role==='doctor'?clinicId:null,present:role==='doctor',reason:'',active:true});if(role==='doctor'){const c=getClinic(clinicId);if(c)c.doctorId=db.users.at(-1).id}save();closeModal();render();toast('تمت إضافة المستخدم','success')}
function clinicsView(){return shell('clinics','إدارة العيادات','تحديد الحد الأقصى ومتابعة حضور الأطباء',`<div class="grid md:grid-cols-2 xl:grid-cols-3 gap-5">${db.clinics.map(c=>{const d=doctorFor(c);return `<div class="bg-white border border-slate-200 rounded-3xl p-5 shadow-soft"><div class="flex items-start justify-between gap-3"><div><h3 class="font-black text-lg">${esc(c.name)}</h3><div class="text-sm text-slate-500 mt-1">${esc(c.specialty)}</div></div>${clinicOpen(c)?statusPill('مفتوحة','bg-emerald-100 text-emerald-800'):statusPill('مغلقة','bg-rose-100 text-rose-800')}</div><div class="mt-5 p-4 rounded-2xl bg-slate-50"><div class="text-xs text-slate-500">الطبيب</div><div class="font-bold mt-1">${d?esc(d.name):'غير محدد'}</div>${d?`<div class="mt-3 flex gap-2">${d.present?`<button onclick="doctorPresence('${d.id}',false)" class="rounded-xl bg-rose-50 text-rose-700 px-3 py-2 text-xs font-bold">تسجيل غياب</button>`:`<button onclick="doctorPresence('${d.id}',true)" class="rounded-xl bg-emerald-50 text-emerald-700 px-3 py-2 text-xs font-bold">تسجيل حضور</button>`}</div>`:''}</div><div class="mt-4"><label class="text-xs font-bold text-slate-500">الحد الأقصى لحجوزات اليوم</label><input type="number" min="1" value="${c.max}" onchange="setCapacity('${c.id}',this.value)" class="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3 font-bold"></div><div class="mt-4 text-sm flex justify-between"><span>محجوز</span><b>${bookingCount(c.id)} / ${c.max}</b></div><div class="mt-2 h-2 rounded-full bg-slate-100 overflow-hidden"><div class="h-full bg-teal-600" style="width:${Math.min(100,bookingCount(c.id)/c.max*100)}%"></div></div></div>`}).join('')}</div>`)}
function setCapacity(id,val){const c=getClinic(id);if(c){c.max=Math.max(1,Number(val)||1);save();render();}}
function doctorPresence(id,present){const d=getUser(id);if(!d)return;if(!present){openReasonModal(id);return}d.present=true;d.reason='';save();render();toast('تم تسجيل حضور الطبيب','success')}
function openReasonModal(id){document.getElementById('modal-root').innerHTML=`<div class="fixed inset-0 z-50 modal-bg grid place-items-center p-4"><div class="bg-white rounded-3xl w-full max-w-md p-6"><h3 class="text-xl font-black">تسجيل غياب الطبيب</h3><textarea id="absence-reason" required class="mt-4 w-full rounded-2xl border border-slate-200 px-4 py-3 min-h-28" placeholder="سبب الغياب"></textarea><div class="flex gap-3 mt-4"><button onclick="saveDoctorReason('${id}')" class="flex-1 rounded-2xl bg-rose-600 text-white py-3 font-bold">تأكيد الغياب</button><button onclick="closeModal()" class="rounded-2xl border px-5 py-3 font-bold">إلغاء</button></div></div></div>`}

async function createBooking(e){e.preventDefault();const name=document.getElementById('patient-name').value.trim(),phone=normPhone(document.getElementById('patient-phone').value),clinicId=document.getElementById('patient-clinic').value,payment=document.querySelector('input[name="payment"]:checked')?.value||'cash',clinic=getClinic(clinicId);if(!clinic||!clinicOpen(clinic)){toast('العيادة غير متاحة حالياً','error');return}if(!phone||phone.length<8){toast('أدخل رقم هاتف صحيح','warn');return}if(bookingCount(clinic.id)>=clinic.max){toast('اكتمل العدد المسموح للعيادة اليوم','error');return}const dup=db.bookings.find(b=>b.date===today()&&b.clinicId===clinic.id&&normPhone(b.phone)===phone&&normName(b.name)===normName(name));if(dup){toast('هذا المريض لديه حجز مطابق بالفعل في نفس العيادة اليوم','error');return}const id=uid(),n=normName(name),secret='demo-client-secret-v2',signature=await shortHash([id,n,phone,today(),secret].join('|')),code=`${id}|${n}|${signature}`,queue=bookingCount(clinic.id)+1;lastTicket={id,name,phone,clinicId:clinic.id,payment,date:today(),time:nowTime(),queue,code,status:'waiting',scanned:false};db.bookings.push(lastTicket);save();render()}

tton><button onclick="printTicketImage()" class="rounded-2xl border border-slate-200 py-3 font-black">🖨️ طباعة</button></div><button onclick="newBooking()" class="w-full mt-3 rounded-2xl bg-slate-100 py-3 font-bold">حجز جديد</button></div></div></div></div>`}

async function buildTicketImage(){if(!lastTicket)return null;if(typeof html2canvas!=='function'){toast('أداة حفظ الصورة لم تُحمّل بعد، حاول مرة أخرى','error');return null}const holder=ticketCaptureElement(),qr=holder.querySelector('#capture-qr');if(window.QRCode)new QRCode(qr,{text:lastTicket.code,width:190,height:190,colorDark:'#0f172a',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});await new Promise(r=>setTimeout(r,120));const canvas=await html2canvas(holder,{scale:2,useCORS:true,backgroundColor:'#f8fafc'});holder.remove();return canvas}
async function saveTicketImage(){try{const canvas=await buildTicketImage();if(!canvas)return;canvas.toBlob(blob=>{if(!blob)return toast('تعذر إنشاء صورة التذكرة','error');const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`ticket-${lastTicket.queue}-${today()}.png`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('تم حفظ التذكرة كصورة PNG','success')},'image/png')}catch(e){toast('حدث خطأ أثناء إنشاء صورة التذكرة','error')}}
async function printTicketImage(){try{const canvas=await buildTicketImage();if(!canvas)return;const data=canvas.toDataURL('image/png'),win=window.open('','_blank','width=820,height=1000');if(!win){toast('المتصفح منع نافذة الطباعة. استخدم حفظ التذكرة كصورة.','warn');return}win.document.write(`<html dir="rtl"><head><title>تذكرة ${esc(lastTicket.queue)}</title><style>@page{margin:8mm}body{margin:0;background:#fff;text-align:center}img{max-width:100%;height:auto}</style></head><body><img src="${data}" alt="تذكرة الحجز"><script>window.onload=()=>{setTimeout(()=>window.print(),250)}<\/script></body></html>`);win.document.close();toast('تم تجهيز التذكرة للطباعة — ويمكن اختيار حفظها PDF من نافذة الطباعة','success')}catch(e){toast('حدث خطأ أثناء تجهيز الطباعة','error')}}
let scannerStream=null,scannerTimer=null;
async function startScanner(){if(!navigator.mediaDevices?.getUserMedia){toast('الكاميرا غير مدعومة في هذا المتصفح','error');return}try{const video=document.getElementById('scanner-video'),ph=document.getElementById('scanner-placeholder'),line=document.getElementById('scanner-line-wrap');scannerStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});video.srcObject=scannerStream;video.classList.remove('hidden');ph.classList.add('hidden');line.classList.remove('hidden');await video.play();if('BarcodeDetector'in window){const supported=await BarcodeDetector.getSupportedFormats().catch(()=>[]);if(!supported.includes('qr_code')){toast('هذا المتصفح لا يدعم قراءة QR تلقائياً. استخدم الإدخال اليدوي.','warn');return}const detector=new BarcodeDetector({formats:['qr_code']});scannerTimer=setInterval(async()=>{if(!video.videoWidth)return;try{const codes=await detector.detect(video);if(codes?.length&&codes[0].rawValue){stopScanner();scannerCode=codes[0].rawValue;const input=document.getElementById('scan-input');if(input)input.value=scannerCode;scanCode()}}catch{}},450);toast('الكاميرا تعمل — وجّهها نحو QR','success')}else toast('الكاميرا تعمل، لكن هذا المتصفح لا يوفر قراءة QR تلقائية. استخدم الإدخال اليدوي.','warn')}catch(e){toast('تعذر تشغيل الكاميرا. امنح إذن الكاميرا واستخدم HTTPS أو localhost.','error')}}
function stopScanner(){if(scannerTimer){clearInterval(scannerTimer);scannerTimer=null}if(scannerStream){scannerStream.getTracks().forEach(t=>t.stop());scannerStream=null}const video=document.getElementById('scanner-video'),ph=document.getElementById('scanner-placeholder'),line=document.getElementById('scanner-line-wrap');if(video){video.pause();video.srcObject=null;video.classList.add('hidden')}ph?.classList.remove('hidden');line?.classList.add('hidden')}
function receptionView(){const waiting=todayBookings().filter(b=>b.status==='waiting').sort((a,b)=>a.queue-b.queue);return shell('reception','الاستقبال والطابور','مسح QR وإدارة دخول المرضى والطابور',`<div class="grid xl:grid-cols-2 gap-5"><div class="bg-white border border-slate-200 rounded-3xl shadow-soft p-5"><h3 class="font-black text-lg">مسح تذكرة QR</h3><div class="scan-frame mt-4 relative overflow-hidden grid place-items-center"><video id="scanner-video" class="hidden absolute inset-0 w-full h-full object-cover" playsinline></video><div id="scanner-placeholder" class="text-center p-6"><div class="text-5xl">▣</div><div class="font-black mt-3">كاميرا QR</div><div class="text-sm text-slate-500 mt-1">يمكنك استخدام الكاميرا أو إدخال الرمز يدوياً.</div></div><div id="scanner-line-wrap" class="hidden absolute inset-x-8 top-1/2"><div class="scan-line"></div></div></div><div class="grid grid-cols-2 gap-3 mt-4"><button onclick="startScanner()" class="rounded-2xl bg-teal-700 text-white py-3 font-black">📷 تشغيل الكاميرا</button><button onclick="stopScanner()" class="rounded-2xl border py-3 font-bold">إيقاف الكاميرا</button></div><div class="mt-4 flex gap-2"><input id="scan-input" value="${esc(scannerCode)}" class="flex-1 rounded-2xl border border-slate-200 px-4 py-3 ltr" placeholder="الصق رمز QR هنا"><button onclick="scanCode()" class="rounded-2xl bg-slate-900 text-white px-5 font-black">تحقق</button></div></div><div class="bg-white border border-slate-200 rounded-3xl shadow-soft p-5"><div class="flex items-center justify-between"><h3 class="font-black text-lg">الطابور الآن</h3>${statusPill(`${waiting.length} منتظر`,'bg-amber-100 text-amber-800')}</div><div class="mt-4 space-y-3 max-h-[500px] overflow-auto">${waiting.map(b=>`<div class="rounded-2xl bg-slate-50 p-4 flex items-center justify-between"><div><div class="font-black">${esc(b.name)}</div><div class="text-xs text-slate-500 mt-1">${esc(getClinic(b.clinicId)?.name||'')}</div></div><div class="text-2xl font-black text-teal-700">#${b.queue}</div></div>`).join('')||'<div class="p-8 text-center text-slate-500">الطابور فارغ.</div>'}</div></div></div>`)}
function scanCode(){const raw=document.getElementById('scan-input')?.value.trim();if(!raw){toast('أدخل أو امسح رمز QR أولاً','warn');return}scannerCode=raw;const b=db.bookings.find(x=>x.code===raw);if(!b){showScanResult(null,'التذكرة غير موجودة على هذا الجهاز. إذا تم الحجز من جهاز آخر، يلزم ربط النظام بـSupabase لمزامنة الحجوزات.');return}const old=db.scans.find(s=>s.bookingId===b.id);if(old){showScanResult(b,`تم استخدام هذه التذكرة بالفعل بواسطة ${old.employeeName||'موظف الاستقبال'} بتاريخ ${old.time||''}.`,true);return}showScanResult(b,'')}
function showScanResult(b,error='',duplicate=false){const root=document.getElementById('modal-root');if(!b){root.innerHTML=`<div class="fixed inset-0 z-50 modal-bg grid place-items-center p-4"><div class="bg-white rounded-3xl w-full max-w-md p-6"><div class="text-3xl">⛔</div><h3 class="text-xl font-black mt-3">لم يتم العثور على التذكرة</h3><p class="text-sm text-slate-500 mt-2 leading-7">${esc(error)}</p><button onclick="closeModal()" class="w-full mt-5 rounded-2xl bg-slate-900 text-white py-3 font-bold">إغلاق</button></div></div>`;return}const earlier=todayBookings(b.clinicId).filter(x=>x.status==='waiting'&&x.queue<b.queue);root.innerHTML=`<div class="fixed inset-0 z-50 modal-bg grid place-items-center p-4"><div class="bg-white rounded-3xl w-full max-w-md p-6 max-h-[90vh] overflow-auto"><div class="flex items-center justify-between"><h3 class="text-xl font-black">بيانات التذكرة</h3><button onclick="closeModal()" class="text-2xl">×</button></div><div class="mt-5 rounded-2xl bg-slate-50 p-4 space-y-3"><div class="flex justify-between"><span class="text-slate-500">المريض</span><b>${esc(b.name)}</b></div><div class="flex justify-between"><span class="text-slate-500">الهاتف</span><b class="ltr">${esc(b.phone)}</b></div><div class="flex justify-between"><span class="text-slate-500">العيادة</span><b>${esc(getClinic(b.clinicId)?.name||'')}</b></div><div class="flex justify-between"><span class="text-slate-500">رقم الدور</span><b class="text-teal-700 text-xl">#${b.queue}</b></div><div class="flex justify-between"><span class="text-slate-500">الدفع</span><b>${b.payment==='cash'?'نقدي':'تأمين'}</b></div></div>${duplicate?`<div class="mt-4 rounded-2xl bg-rose-50 border border-rose-200 text-rose-800 p-4 text-sm font-bold">${esc(error)}</div>`:earlier.length?`<div class="mt-4 rounded-2xl bg-amber-50 border border-amber-200 text-amber-800 p-4 text-sm leading-6"><b>تنبيه طابور:</b> يوجد ${earlier.length} حالة منتظرة قبل هذا الرقم. يمكنك إدخاله الآن أو بعد حالتين.</div><div class="grid grid-cols-2 gap-3 mt-4"><button onclick="completeScan('${b.id}','late-now')" class="rounded-2xl bg-teal-700 text-white py-3 font-black">إدخاله الآن</button><button onclick="completeScan('${b.id}','after-two')" class="rounded-2xl border border-amber-300 py-3 font-bold">بعد حالتين</button></div>`:`<div class="mt-4 rounded-2xl bg-emerald-50 border border-emerald-200 text-emerald-800 p-4 text-sm font-bold">التذكرة صالحة ويمكن إدخال المريض.</div><button onclick="completeScan('${b.id}','normal')" class="w-full mt-4 rounded-2xl bg-teal-700 text-white py-3.5 font-black">تأكيد دخول المريض</button>`}</div></div>`}
function completeScan(id,mode){const b=db.bookings.find(x=>x.id===id);if(!b)return;const old=db.scans.find(s=>s.bookingId===id);if(old){toast('تم مسح التذكرة مسبقاً','error');closeModal();return}b.status='served';b.scanned=true;b.scanMode=mode;b.scannedAt=new Date().toISOString();db.scans.push({id:uid(),bookingId:id,employeeId:session?.id||null,employeeName:session?.name||'موظف الاستقبال',time:nowTime(),date:today(),mode});save();closeModal();render();toast('تم تسجيل دخول المريض بنجاح','success')}
function openNoShowModal(id){markNoShow(id)}function markNoShow(id){const b=db.bookings.find(x=>x.id===id);if(b){b.status='no-show';save();render();toast('تم تسجيل الحالة كلم يحضر','warn')}}
function closeModal(){document.getElementById('modal-root').innerHTML=''}
function render(){if(view==='login'){document.getElementById('app').innerHTML=loginView();return}if(view==='patient'){document.getElementById('app').innerHTML=lastTicket?ticketSuccess(lastTicket):patientView();return}if(!session){view='login';document.getElementById('app').innerHTML=loginView();return}const html=view==='admin'?adminView():view==='users'?usersView():view==='clinics'?clinicsView():view==='doctor'?doctorView():view==='reception'?receptionView():loginView();document.getElementById('app').innerHTML=html}
if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
window.nav=nav;window.logout=logout;window.doLogin=doLogin;window.openUserModal=openUserModal;window.closeModal=closeModal;window.saveUser=saveUser;window.toggleClinicField=toggleClinicField;window.setCapacity=setCapacity;window.doctorPresence=doctorPresence;window.saveDoctorReason=saveDoctorReason;window.createBooking=createBooking;window.newBooking=newBooking;window.saveTicketImage=saveTicketImage;window.printTicketImage=printTicketImage;window.startScanner=startScanner;window.stopScanner=stopScanner;window.scanCode=scanCode;window.completeScan=completeScan;window.openNoShowModal=openNoShowModal;window.markNoShow=markNoShow;
})();
</script>
</body>
</html>
